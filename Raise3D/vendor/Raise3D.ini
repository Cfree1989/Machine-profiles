# Raise3D Pro2 Plus Hyper Speed - experimental PrusaSlicer vendor bundle
# NOT production-ready. 0.4 mm Dual (T0+T1); unused tools skipped via is_extruder_used.
# Single print profile from this machine's ideaMaker Hyper Speed PLA jobs (0.20 mm).
# Left-only from LeftonlyExtruder.gcode; right-only from RightonlyExtruder.gcode; dual from MulticolorRaise3d.gcode.
# Community 2022 Marlin Pro2 bundles are not the source of start/end G-code.

[vendor]
repo_id = non-prusa-fff
name = Raise3D (experimental)
config_version = 0.5.57

[printer_model:PRO2PLUS_HS_DUAL]
