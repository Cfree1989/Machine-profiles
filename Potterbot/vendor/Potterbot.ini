inherits = *common*
printer_model = POTTERBOT9
printer_variant = 1
bed_shape = 368.3x0,369.958x0.109,371.587x0.433,373.16x0.967,374.65x1.701,376.031x2.624,377.28x3.72,378.376x4.969,379.299x6.35,380.033x7.84,380.567x9.413,380.891x11.042,381x12.7,381x360,0x360,0x12.7,0.109x11.042,0.433x9.413,0.967x7.84,1.701x6.35,2.624x4.969,3.72x3.72,4.969x2.624,6.35x1.701,7.84x0.967,9.413x0.433,11.042x0.109,12.7x0
max_print_height = 400
nozzle_diameter = 1
max_layer_height = 1
min_layer_height = 0.2
retract_lift_above = 0.9
default_print_profile = Vase Hollow @Potterbot 1mm
printer_notes = Don't remove the following keywords! These keywords are used in the compatible printer condition of the print and filament profiles.\nPRINTER_VENDOR_POTTERBOT\nPRINTER_MODEL_9\nNO_TEMPLATES\nEXPERIMENTAL\nNot production-ready. 3D Potterbot 9, Duet 2 WiFi, RRF 2.04RC1, 1 mm nozzle. Clay is cold (no heaters). Layer height is 0.8 mm (below the nozzle so PrusaSlicer will slice; official 1.5 mm Fine is taller than this tip). The printer itself does not retract (official Cura: G28, then the first travel includes Z down to the layer). Pick the filament to choose retraction: Clay Potterbot is unretracted (vase profiles only); Clay Potterbot Retract is 80 mm at 80 mm/s with a 5 mm Z-hop above 0.9 mm (not the FAQ 1000 mm/s) and drops to Z10 after G28. NO_TEMPLATES hides PrusaSlicer Template filaments for this printer. Match line width to the nozzle on the machine. Bed is the 15x15 in bat (381 mm) clipped to Y 360, with the two front corners rounded 12.7 mm like the bat. After G28 the head is at X420 Y0 Z400.

