[filament:Clay Potterbot]
inherits = *common*
compatible_prints_condition = spiral_vase==1
filament_colour = #55AAFF
filament_notes = "EXPERIMENTAL. Official 3D Potter Clay material: 1.75 mm volumetric model, 0 C, no fan. No mid-print retract (official Cura). Offered only with Vase Hollow / Vase Bottom; pick Clay Potterbot Retract for Infill. End G-code retracts E-500. Prime clay from Duet macros if the ram is not already charged."

[filament:Clay Potterbot Retract]
inherits = *common*
filament_colour = #C4A574
filament_retract_length = 80
filament_retract_lift = 5
start_filament_gcode = "; Clay Potterbot Retract\nG1 Z10 F1000 ;drop from Z400 before slicer retract"
filament_notes = "EXPERIMENTAL. Same clay as Clay Potterbot with PrusaSlicer filament overrides: mid-print retract 80 mm at 80 mm/s (printer retract/deretract speed) with a 5 mm Z-hop after layer 0 (printer retract_lift_above). Not the FAQ 1000 mm/s recipe. Filament start G-code drops to Z10 after G28 so the first retract is not at the top of the column. Required for Infill; fine for vase (retracts only around the skirt and bottoms). End G-code retracts E-500."
