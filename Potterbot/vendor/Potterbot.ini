notes = EXPERIMENTAL. Infill / multi-object clay. 15% Line infill, 3 Archimedean-chord bottoms, 3 Archimedean-chord tops. External perimeters print first. Internal bridges use a reduced flow so the first solid over sparse infill is a normal bead, not a round nozzle-diameter blob. Use the Clay Potterbot Retract filament (80 mm at 80 mm/s, 5 mm Z-hop after layer 0; its start G-code drops to Z10). Clay Potterbot is not offered with this profile. Raise infill % on the plater if you need it. Sequential printing is on; space objects by 40 mm radius (full 400 mm height is allowed).
compatible_printers_condition = printer_notes=~/.*PRINTER_VENDOR_POTTERBOT.*/ and printer_notes=~/.*PRINTER_MODEL_9.*/ and nozzle_diameter[0]==10
