duplicate_distance = 80
default_acceleration = 3000
dont_support_bridges = 1
elefant_foot_compensation = 0
enable_dynamic_overhang_speeds = 0
ensure_vertical_shell_thickness = 0
external_perimeter_acceleration = 3000
external_perimeter_speed = 40
external_perimeters_first = 1
extra_perimeters = 0
fill_angle = 45
fill_density = 0%
fill_pattern = line
first_layer_acceleration = 3000
first_layer_acceleration_over_raft = 0
first_layer_infill_speed = 20
first_layer_speed = 40
first_layer_speed_over_raft = 30
gap_fill_enabled = 0
gap_fill_speed = 40
gcode_comments = 1
gcode_label_objects = 0
gcode_resolution = 0.1
infill_acceleration = 3000
infill_anchor = 0
infill_anchor_max = 0
infill_every_layers = 1
infill_extruder = 1
infill_overlap = 15%
infill_speed = 40
max_print_speed = 85
max_volumetric_speed = 0
min_skirt_length = 0
notes = EXPERIMENTAL. Clay profiles for Potterbot 9. Layer height 1.5 mm from official 3D Potter Fine except the 1 mm nozzle (0.8 mm so extrusion width stays above layer height). Line width equals the installed nozzle. Bottoms and visible tops are Archimedean chords; sparse infill is Line; external perimeters print first. 15% infill overlap so bottoms meet the wall. Sequential printing (complete objects) is on: add each pot as its own object and keep 40 mm radius clearance. Post-process matches Cura clay volume and holds full ram flow on the first spiral loop. PrusaSlicer Preview draws flat clay beads as rounder tubes — the dark grid is the viewer, not missing clay. Speeds from official Cura (40 mm/s print, 80 travel, 20 bottom). Print/travel acceleration 3000 mm/s² matches firmware M201 (Cura jobs emit no M204). No fan / no heaters (cooling off). Retraction is chosen by filament: Clay Potterbot is unretracted (official Cura; vase profiles only), Clay Potterbot Retract is 80 mm at 80 mm/s with a 5 mm hop after layer 0 and drops to Z10 after G28. Infill requires Clay Potterbot Retract. End G-code lifts Z 10 mm and pulls E-500.
layer_height = 1.5
first_layer_height = 1.5
only_retract_when_crossing_perimeters = 1
ooze_prevention = 0
output_filename_format = {input_filename_base}_{layer_height}mm_{printer_variant}n_{print_time}.gcode
overhangs = 0
perimeter_acceleration = 3000
perimeter_extruder = 1
perimeter_generator = arachne
perimeter_speed = 40
perimeters = 1
post_process = "C:\\Windows\\py.exe -3 C:\\Repos\\Machine-profiles\\Potterbot\\scripts\\validate_gcode.py"
raft_layers = 0
resolution = 0
seam_position = nearest
single_extruder_multi_material_priming = 0
skirts = 3
skirt_distance = 8
slice_closing_radius = 0.049
small_perimeter_speed = 40
solid_infill_acceleration = 3000
solid_infill_below_area = 0
solid_infill_every_layers = 0
solid_infill_extruder = 1
